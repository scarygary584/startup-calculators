<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Window Washing Business Profit Calculator | Startup Calculators</title>
  <meta name="description" content="Estimate window washing revenue, supplies, labor, travel, monthly profit, profit per hour, and startup payback for a residential or commercial route.">
  <link rel="canonical" href="https://www.startupprofitcalculators.com/window-washing-business-profit-calculator/">
  <meta property="og:title" content="Window Washing Business Profit Calculator">
  <meta property="og:description" content="Estimate job revenue, route costs, monthly profit, hourly profit, and startup payback.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.startupprofitcalculators.com/window-washing-business-profit-calculator/">
  <link rel="stylesheet" href="../styles.css">
  <script src="../calculator-validation.js" defer></script><link rel="stylesheet" href="../simple-calculators.css"></head>
<body class="theme-pressure simple-calculator-page" data-calculator=""><header class="simple-header"><a href="../#calculators">All calculators</a></header><main class="simple-main"><h1>Window Washing Business Profit Calculator</h1><section class="section calculator-grid" id="calculator">
      <form class="calculator-card"><div class="field"><label for="windows">Windows per job</label><input id="windows" type="number" value="28" min="0"></div><div class="field"><label for="price">Price per window</label><input id="price" type="number" value="8" min="0" step="0.5"></div><div class="field"><label for="jobsDay">Jobs per day</label><input id="jobsDay" type="number" value="3" min="0" step="0.5"></div><div class="field"><label for="days">Work days per month</label><input id="days" type="number" value="18" min="0"></div><div class="field"><label for="supplies">Supplies per job</label><input id="supplies" type="number" value="12" min="0"></div><div class="field"><label for="hours">Labor hours per job</label><input id="hours" type="number" value="1.5" min="0" step="0.1"></div><div class="field"><label for="labor">Labor cost per hour</label><input id="labor" type="number" value="22" min="0"></div><div class="field"><label for="fuel">Fuel and travel per job</label><input id="fuel" type="number" value="10" min="0"></div><div class="field"><label for="overhead">Monthly overhead</label><input id="overhead" type="number" value="450" min="0"></div><div class="field"><label for="startup">Startup cost</label><input id="startup" type="number" value="1800" min="0"></div></form>
      <aside class="results-card"><div class="result-row featured"><span>Estimated monthly profit</span><strong id="monthly">$0</strong></div><div class="result-row"><span>Revenue per job</span><strong id="revenue">$0</strong></div><div class="result-row"><span>Profit per job</span><strong id="profit">$0</strong></div><div class="result-row"><span>Estimated profit per labor hour</span><strong id="hourly">$0</strong></div><div class="result-row"><span>Startup payback</span><strong id="payback">0 months</strong></div></aside>
    </section>
    </main><footer class="simple-footer"><a href="../#calculators">All calculators</a></footer><script>
    const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    function value(id) { const x=Number(document.getElementById(id).value);return Number.isFinite(x)?Math.max(0,x):0; }
    function output(id, result) { document.getElementById(id).textContent = result; }
    function calculate() {
      const revenue = value('windows') * value('price');
      const directCost = value('supplies') + value('hours') * value('labor') + value('fuel');
      const profit = revenue - directCost;
      const monthly = profit * value('jobsDay') * value('days') - value('overhead');
      const laborHours = value('hours') * value('jobsDay') * value('days');
      output('monthly', money.format(monthly)); output('revenue', money.format(revenue)); output('profit', money.format(profit)); output('hourly', money.format(laborHours ? monthly / laborHours : 0)); output('payback', monthly > 0 ? (value('startup') / monthly).toFixed(1) + ' months' : 'N/A');
    }
    document.querySelectorAll('input').forEach((input) => input.addEventListener('input', calculate));
    calculate();
  </script>
</body></html>
