<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Deck Building Business Profit Calculator</title><meta name="description" content="Estimate deck building project revenue, lumber and material costs, labor, permits, monthly profit, margin, and startup payback."><link rel="canonical" href="https://www.startupprofitcalculators.com/deck-building-business-profit-calculator/"><link rel="stylesheet" href="../styles.css"><script src="../calculator-validation.js" defer></script><link rel="stylesheet" href="../simple-calculators.css"></head><body class="theme-stump simple-calculator-page" data-calculator=""><header class="simple-header"><a href="../#calculators">All calculators</a></header><main class="simple-main"><h1>Deck Building Business Profit Calculator</h1><section class="section calculator-grid"><form class="calculator-card"><div class="field"><label for="sqft">Deck square feet</label><input id="sqft" type="number" value="320"></div><div class="field"><label for="price">Price per square foot</label><input id="price" type="number" value="55"></div><div class="field"><label for="mat">Material cost per square foot</label><input id="mat" type="number" value="25"></div><div class="field"><label for="days">Labor days</label><input id="days" type="number" value="5"></div><div class="field"><label for="crew">Crew cost per day</label><input id="crew" type="number" value="650"></div><div class="field"><label for="permit">Permits/design/haul-off</label><input id="permit" type="number" value="700"></div><div class="field"><label for="jobs">Projects per month</label><input id="jobs" type="number" value="2"></div><div class="field"><label for="overhead">Monthly overhead</label><input id="overhead" type="number" value="1800"></div><div class="field"><label for="startup">Startup/tool cost</label><input id="startup" type="number" value="12000"></div></form><aside class="results-card"><div class="result-row featured"><span>Monthly profit</span><strong id="monthly">$0</strong></div><div class="result-row"><span>Project revenue</span><strong id="revenue">$0</strong></div><div class="result-row"><span>Project profit</span><strong id="profit">$0</strong></div><div class="result-row"><span>Profit margin</span><strong id="margin">0%</strong></div><div class="result-row"><span>Tool payback</span><strong id="payback">0 months</strong></div></aside></section></main><footer class="simple-footer"><a href="../#calculators">All calculators</a></footer><script>const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});function v(id){const x=Number(document.getElementById(id).value);return Number.isFinite(x)?Math.max(0,x):0}function out(id,val){document.getElementById(id).textContent=val}function calc(){const revenue=v('sqft')*v('price');const cost=v('sqft')*v('mat')+v('days')*v('crew')+v('permit');const profit=revenue-cost;const monthly=profit*v('jobs')-v('overhead');out('monthly',money.format(monthly));out('revenue',money.format(revenue));out('profit',money.format(profit));out('margin',revenue?((profit/revenue)*100).toFixed(1)+'%':'0%');out('payback',monthly>0?(v('startup')/monthly).toFixed(1)+' months':'N/A')}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));calc();</script></body></html>
