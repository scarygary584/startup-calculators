<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ice and Water Vending Profit Calculator | Startup Profit Calculators</title><meta name="description" content="Estimate ice bag and water sales, location rent, revenue share, utilities, maintenance, monthly profit, and break-even sales."><link rel="canonical" href="https://www.startupprofitcalculators.com/ice-water-vending-profit-calculator/"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../simple-calculators.css"></head><body class="theme-equipment simple-calculator-page"><header class="simple-header"><a href="../#calculators">All calculators</a></header><main class="simple-main"><h1>Ice and Water Vending Profit Calculator</h1><section class="section calculator-grid" id="calculator"><form class="calculator-card" id="calculator-form"><div class="field"><label for="small">10 lb bags sold per day</label><input id="small" name="small" type="number" min="0" step="any" value="30"></div><div class="field"><label for="smallPrice">Price per 10 lb bag</label><input id="smallPrice" name="smallPrice" type="number" min="0" step="any" value="2"></div><div class="field"><label for="large">20 lb bags sold per day</label><input id="large" name="large" type="number" min="0" step="any" value="10"></div><div class="field"><label for="largePrice">Price per 20 lb bag</label><input id="largePrice" name="largePrice" type="number" min="0" step="any" value="3.5"></div><div class="field"><label for="days">Operating days per month</label><input id="days" name="days" type="number" min="0" step="any" value="30"></div><div class="field"><label for="water">Water vending revenue per month</label><input id="water" name="water" type="number" min="0" step="any" value="300"></div><div class="field"><label for="bag">Packaging cost per bag (utilities entered separately)</label><input id="bag" name="bag" type="number" min="0" step="any" value="0.1"></div><div class="field"><label for="utilities">Monthly water and electricity</label><input id="utilities" name="utilities" type="number" min="0" step="any" value="500"></div><div class="field"><label for="rent">Fixed location rent per month (0 for share-only)</label><input id="rent" name="rent" type="number" min="0" step="any" value="550"></div><div class="field"><label for="share">Landlord revenue share % (0 for fixed-rent only)</label><input id="share" name="share" type="number" min="0" max="100" step="any" value="0"></div><div class="field"><label for="maintenance">Monthly maintenance and repair reserve</label><input id="maintenance" name="maintenance" type="number" min="0" step="any" value="200"></div><div class="field"><label for="other">Other monthly costs: insurance, filters, fees, labor</label><input id="other" name="other" type="number" min="0" step="any" value="150"></div><div class="field"><label for="startup">Total equipment, repairs, and setup investment</label><input id="startup" name="startup" type="number" min="0" step="any" value="20000"></div></form><aside class="results-card" aria-live="polite"><div class="result-row"><span>Monthly revenue</span><strong id="result-revenue"></strong></div><div class="result-row"><span>Monthly entered costs</span><strong id="result-costs"></strong></div><div class="result-row featured"><span>Monthly profit before tax and owner pay</span><strong id="result-profit"></strong></div><div class="result-row"><span>Annualized profit at this activity</span><strong id="result-annual"></strong></div><div class="result-row"><span>Break-even revenue at this sales mix</span><strong id="result-breakEven"></strong></div><div class="result-row"><span>Simple startup payback (months)</span><strong id="result-payback"></strong></div></aside></section></main><footer class="simple-footer"><a href="../#calculators">All calculators</a></footer><script>function compute(v){const bags=(v.small+v.large)*v.days;const ice=(v.small*v.smallPrice+v.large*v.largePrice)*v.days;const revenue=ice+v.water;const share=revenue*Math.min(v.share,100)/100;const costs=bags*v.bag+v.utilities+v.rent+share+v.maintenance+v.other;const profit=revenue-costs;const fixed=v.utilities+v.rent+v.maintenance+v.other;const ratio=revenue>0?(revenue-bags*v.bag-share)/revenue:0;return {revenue,costs,profit,annual:profit*12,breakEven:ratio>0?fixed/ratio:NaN,payback:profit>0?v.startup/profit:NaN};};const fields=["small","smallPrice","large","largePrice","days","water","bag","utilities","rent","share","maintenance","other","startup"];const outputs=[["revenue","Monthly revenue","money"],["costs","Monthly entered costs","money"],["profit","Monthly profit before tax and owner pay","money"],["annual","Annualized profit at this activity","money"],["breakEven","Break-even revenue at this sales mix","money"],["payback","Simple startup payback (months)","number"]];const money=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});const number=new Intl.NumberFormat("en-US",{maximumFractionDigits:1});function render(){const v={};fields.forEach(id=>{const x=Number(document.getElementById(id).value);v[id]=Number.isFinite(x)?Math.max(0,x):0});const result=compute(v);outputs.forEach(([id,label,type])=>{document.getElementById("result-"+id).textContent=Number.isFinite(result[id])?(type==="money"?money:number).format(result[id]):"N/A"})}fields.forEach(id=>document.getElementById(id).addEventListener("input",render));document.getElementById("calculator-form").addEventListener("submit",e=>e.preventDefault());render();</script></body></html>
