<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Christmas Window Painting Profit Calculator</title><meta name="description" content="Estimate Christmas window painting seasonal revenue, paint costs, travel, labor, storefront jobs, profit per hour, and seasonal profit."><link rel="canonical" href="https://www.startupprofitcalculators.com/christmas-window-painting-profit-calculator/"><link rel="stylesheet" href="../styles.css"><script src="../calculator-validation.js" defer></script><link rel="stylesheet" href="../simple-calculators.css"></head><body class="theme-foodtruck simple-calculator-page" data-calculator=""><header class="simple-header"><a href="../#calculators">All calculators</a></header><main class="simple-main"><h1>Christmas Window Painting Profit Calculator</h1><section class="section calculator-grid"><form class="calculator-card"><div class="field"><label for="jobs">Storefront jobs per season</label><input id="jobs" type="number" value="35"></div><div class="field"><label for="price">Average price per storefront</label><input id="price" type="number" value="275"></div><div class="field"><label for="materials">Paint/supplies per job</label><input id="materials" type="number" value="28"></div><div class="field"><label for="hours">Hours per job</label><input id="hours" type="number" value="2.5" step="0.1"></div><div class="field"><label for="rate">Labor cost per hour</label><input id="rate" type="number" value="25"></div><div class="field"><label for="travel">Travel per job</label><input id="travel" type="number" value="12"></div><div class="field"><label for="marketing">Seasonal marketing cost</label><input id="marketing" type="number" value="350"></div><div class="field"><label for="startup">Startup cost</label><input id="startup" type="number" value="650"></div></form><aside class="results-card"><div class="result-row featured"><span>Seasonal profit</span><strong id="seasonal">$0</strong></div><div class="result-row"><span>Seasonal revenue</span><strong id="revenue">$0</strong></div><div class="result-row"><span>Profit per job</span><strong id="profit">$0</strong></div><div class="result-row"><span>Profit per hour</span><strong id="hourly">$0</strong></div><div class="result-row"><span>Startup payback</span><strong id="payback">0 seasons</strong></div></aside></section></main><footer class="simple-footer"><a href="../#calculators">All calculators</a></footer><script>const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});function v(id){const x=Number(document.getElementById(id).value);return Number.isFinite(x)?Math.max(0,x):0}function out(id,val){document.getElementById(id).textContent=val}function calc(){const rev=v('jobs')*v('price');const jobProfit=v('price')-v('materials')-v('hours')*v('rate')-v('travel');const seasonal=jobProfit*v('jobs')-v('marketing');const totalHours=v('jobs')*v('hours');out('seasonal',money.format(seasonal));out('revenue',money.format(rev));out('profit',money.format(jobProfit));out('hourly',money.format(totalHours?seasonal/totalHours:0));out('payback',seasonal>0?(v('startup')/seasonal).toFixed(1)+' seasons':'N/A')}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));calc();</script></body></html>
