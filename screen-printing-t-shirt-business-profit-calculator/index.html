<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Screen Printing T-Shirt Business Profit Calculator</title><meta name="description" content="Estimate screen printing t-shirt order revenue, shirt costs, ink and supplies, labor, monthly profit, and equipment payback."><link rel="canonical" href="https://www.startupprofitcalculators.com/screen-printing-t-shirt-business-profit-calculator/"><link rel="stylesheet" href="../styles.css"><script src="../calculator-validation.js" defer></script><link rel="stylesheet" href="../simple-calculators.css"></head><body class="theme-equipment simple-calculator-page" data-calculator=""><header class="simple-header"><a href="../#calculators">All calculators</a></header><main class="simple-main"><h1>Screen Printing T-Shirt Business Profit Calculator</h1><section class="section calculator-grid"><form class="calculator-card" id="calc"><div class="field"><label for="shirts">Shirts per order</label><input id="shirts" type="number" value="100"></div><div class="field"><label for="price">Price per shirt</label><input id="price" type="number" value="18"></div><div class="field"><label for="blank">Blank shirt cost each</label><input id="blank" type="number" value="5"></div><div class="field"><label for="supplies">Ink, screens, and supplies per order</label><input id="supplies" type="number" value="90"></div><div class="field"><label for="hours">Labor hours per order</label><input id="hours" type="number" value="6"></div><div class="field"><label for="rate">Labor cost per hour</label><input id="rate" type="number" value="25"></div><div class="field"><label for="orders">Orders per month</label><input id="orders" type="number" value="12"></div><div class="field"><label for="overhead">Monthly overhead</label><input id="overhead" type="number" value="800"></div><div class="field"><label for="startup">Equipment/startup cost</label><input id="startup" type="number" value="9000"></div></form><aside class="results-card"><div class="result-row featured"><span>Monthly profit</span><strong id="monthlyProfit">$0</strong></div><div class="result-row"><span>Revenue per order</span><strong id="revenue">$0</strong></div><div class="result-row"><span>Profit per order</span><strong id="profit">$0</strong></div><div class="result-row"><span>Profit per shirt</span><strong id="unitProfit">$0</strong></div><div class="result-row"><span>Equipment payback</span><strong id="payback">0 months</strong></div></aside></section></main><footer class="simple-footer"><a href="../#calculators">All calculators</a></footer><script>const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});function v(id){const x=Number(document.getElementById(id).value);return Number.isFinite(x)?Math.max(0,x):0}function out(id,val){document.getElementById(id).textContent=val}function calc(){const shirts=v('shirts'),price=v('price'),blank=v('blank'),supplies=v('supplies'),hours=v('hours'),rate=v('rate'),orders=v('orders'),overhead=v('overhead'),startup=v('startup');const revenue=shirts*price;const cost=shirts*blank+supplies+hours*rate;const profit=revenue-cost;const monthly=profit*orders-overhead;out('monthlyProfit',money.format(monthly));out('revenue',money.format(revenue));out('profit',money.format(profit));out('unitProfit',money.format(shirts?profit/shirts:0));out('payback',monthly>0?(startup/monthly).toFixed(1)+' months':'N/A')}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));calc();</script></body></html>
