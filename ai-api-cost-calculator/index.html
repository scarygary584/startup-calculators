</main><footer class="simple-footer"><a href="../#calculators">All calculators</a></footer><script>(function(){const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});const number=new Intl.NumberFormat('en-US',{maximumFractionDigits:1});const form=document.getElementById('calcForm');const results=document.getElementById('results');const rows=[['monthlyRequests','Monthly API requests','number',true],['inputTotal','Monthly input tokens','number'],['outputTotal','Monthly output tokens','number'],['apiCost','Estimated API cost','money'],['totalCost','Total monthly cost','money'],['revenue','Estimated monthly revenue','money'],['grossProfit','Estimated gross profit','money'],['costPerUser','API cost per user','money']];results.innerHTML=rows.map(([id,label,type,featured])=>`<div class="result-row${featured?' featured':''}"><span>${label}</span><strong data-result="${id}" data-type="${type}">0</strong></div>`).join('');function v(id){const n=parseFloat(document.getElementById(id).value);return Number.isFinite(n)&&n>0?n:0}function f(value,type){return !Number.isFinite(value)?'N/A':type==='money'?money.format(value):number.format(value)}function calc(){const users=v('users'),requests=v('requests'),inputTokens=v('inputTokens'),outputTokens=v('outputTokens'),inputPrice=v('inputPrice'),outputPrice=v('outputPrice'),retryPercent=v('retryPercent'),overhead=v('overhead'),pricePerUser=v('pricePerUser');const retryMultiplier=1+(retryPercent/100);const monthlyRequests=users*requests*retryMultiplier;const inputTotal=monthlyRequests*inputTokens;const outputTotal=monthlyRequests*outputTokens;const inputCost=(inputTotal/1000000)*inputPrice;const outputCost=(outputTotal/1000000)*outputPrice;const apiCost=inputCost+outputCost;const totalCost=apiCost+overhead;const revenue=users*pricePerUser;const grossProfit=revenue-totalCost;const costPerUser=users>0?apiCost/users:NaN;const data={monthlyRequests,inputTotal,outputTotal,apiCost,totalCost,revenue,grossProfit,costPerUser};Object.entries(data).forEach(([id,value])=>{const node=results.querySelector(`[data-result="${id}"]`);if(node)node.textContent=f(value,node.dataset.type);});}form.addEventListener('input',calc);calc();})();</script>
