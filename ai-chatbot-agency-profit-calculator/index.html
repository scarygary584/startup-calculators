<body class="theme-equipment simple-calculator-page"><header class="simple-header"><a href="../#calculators">All calculators</a></header><main class="simple-main"><h1>AI Chatbot Agency Profit Calculator</h1><section class="section" id="calculator"><div class="calculator-grid"><form class="calculator-card" id="calcForm"><div class="field"><label for="clients">Active clients</label><input id="clients" type="number" min="0" step="1" value="8"></div><div class="field"><label for="retainer">Monthly retainer per client</label><input id="retainer" type="number" min="0" step="0.01" value="250"></div><div class="field"><label for="setupFee">Setup fee per new client</label><input id="setupFee" type="number" min="0" step="0.01" value="750"></div><div class="field"><label for="newClients">New clients this month</label><input id="newClients" type="number" min="0" step="1" value="2"></div><div class="field"><label for="platform">Chatbot platform cost/month</label><input id="platform" type="number" min="0" step="0.01" value="250"></div><div class="field"><label for="messages">Messages per client/month</label><input id="messages" type="number" min="0" step="1" value="1200"></div><div class="field"><label for="costPerThousand">AI/message cost per 1,000 messages</label><input id="costPerThousand" type="number" min="0" step="0.01" value="3"></div><div class="field"><label for="supportHours">Support hours/month</label><input id="supportHours" type="number" min="0" step="0.1" value="12"></div><div class="field"><label for="hourlyValue">Your support time value/hour</label><input id="hourlyValue" type="number" min="0" step="0.01" value="35"></div><div class="field"><label for="outreach">Outreach/tools/month</label><input id="outreach" type="number" min="0" step="0.01" value="300"></div><div class="field"><label for="misc">Other monthly expenses</label><input id="misc" type="number" min="0" step="0.01" value="100"></div></form><aside class="results-card"><div id="results"></div></aside></div></section>
</main><footer class="simple-footer"><a href="../#calculators">All calculators</a></footer><script>(function(){const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});const number=new Intl.NumberFormat('en-US',{maximumFractionDigits:1});const form=document.getElementById('calcForm');const results=document.getElementById('results');const rows=[['mrr','Monthly recurring revenue','money'],['setup','Setup fee revenue this month','money'],['revenue','Total monthly revenue','money'],['messageCost','Monthly AI/message costs','money'],['expenses','Monthly expenses','money'],['profit','Estimated monthly profit','money',true],['profitPerClient','Profit per active client','money'],['breakEven','Break-even clients','number']];results.innerHTML=rows.map(([id,label,type,featured])=>`<div class="result-row${featured?' featured':''}"><span>${label}</span><strong data-result="${id}" data-type="${type}">0</strong></div>`).join('');function v(id){const n=parseFloat(document.getElementById(id).value);return Number.isFinite(n)&&n>0?n:0}function f(value,type){return !Number.isFinite(value)?'N/A':type==='money'?money.format(value):number.format(value)}function calc(){const clients=v('clients'),retainer=v('retainer'),setupFee=v('setupFee'),newClients=v('newClients'),platform=v('platform'),messages=v('messages'),costPerThousand=v('costPerThousand'),supportHours=v('supportHours'),hourlyValue=v('hourlyValue'),outreach=v('outreach'),misc=v('misc');const mrr=clients*retainer;const setup=setupFee*newClients;const revenue=mrr+setup;const messageCost=(clients*messages/1000)*costPerThousand;const supportCost=supportHours*hourlyValue;const expenses=platform+messageCost+supportCost+outreach+misc;const profit=revenue-expenses;const profitPerClient=clients>0?(mrr-expenses)/clients:0;const contribution=retainer-messages/1000*costPerThousand;const breakEven=contribution>0?Math.ceil((platform+supportCost+outreach+misc)/contribution):NaN;const data={mrr,setup,revenue,messageCost,expenses,profit,profitPerClient,breakEven};Object.entries(data).forEach(([id,value])=>{const node=results.querySelector(`[data-result="${id}"]`);if(node)node.textContent=f(value,node.dataset.type);});}form.addEventListener('input',calc);calc();})();</script>
</body></html>
