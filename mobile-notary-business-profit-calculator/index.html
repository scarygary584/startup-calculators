<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mobile Notary Business Profit Calculator</title><meta name="description" content="Estimate mobile notary appointment revenue, travel fees, fuel, platform fees, supplies, monthly profit, and startup payback."><link rel="canonical" href="https://www.startupprofitcalculators.com/mobile-notary-business-profit-calculator/"><link rel="stylesheet" href="../styles.css"><script src="../calculator-validation.js" defer></script><link rel="stylesheet" href="../simple-calculators.css"></head><body class="theme-100k simple-calculator-page" data-calculator=""><header class="simple-header"><a href="../#calculators">All calculators</a></header><main class="simple-main"><h1>Mobile Notary Business Profit Calculator</h1><section class="section calculator-grid"><form class="calculator-card"><div class="field"><label for="fee">Notary/signing fee</label><input id="fee" type="number" value="95"></div><div class="field"><label for="travelFee">Travel fee charged</label><input id="travelFee" type="number" value="25"></div><div class="field"><label for="appts">Appointments per month</label><input id="appts" type="number" value="40"></div><div class="field"><label for="fuel">Fuel/travel cost per appointment</label><input id="fuel" type="number" value="14"></div><div class="field"><label for="supplies">Printing/supplies per appointment</label><input id="supplies" type="number" value="6"></div><div class="field"><label for="platform">Platform/referral fee per appointment</label><input id="platform" type="number" value="10"></div><div class="field"><label for="overhead">Monthly overhead</label><input id="overhead" type="number" value="250"></div><div class="field"><label for="startup">Startup cost</label><input id="startup" type="number" value="900"></div></form><aside class="results-card"><div class="result-row featured"><span>Monthly profit</span><strong id="monthly">$0</strong></div><div class="result-row"><span>Revenue per appointment</span><strong id="revenue">$0</strong></div><div class="result-row"><span>Profit per appointment</span><strong id="profit">$0</strong></div><div class="result-row"><span>Break-even appointments</span><strong id="breakEven">0</strong></div><div class="result-row"><span>Startup payback</span><strong id="payback">0 months</strong></div></aside></section></main><footer class="simple-footer"><a href="../#calculators">All calculators</a></footer><script>const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});function v(id){const x=Number(document.getElementById(id).value);return Number.isFinite(x)?Math.max(0,x):0}function out(id,val){document.getElementById(id).textContent=val}function calc(){const rev=v('fee')+v('travelFee');const profit=rev-v('fuel')-v('supplies')-v('platform');const monthly=profit*v('appts')-v('overhead');out('monthly',money.format(monthly));out('revenue',money.format(rev));out('profit',money.format(profit));out('breakEven',profit>0?Math.ceil(v('overhead')/profit):'N/A');out('payback',monthly>0?(v('startup')/monthly).toFixed(1)+' months':'N/A')}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));calc();</script></body></html>
