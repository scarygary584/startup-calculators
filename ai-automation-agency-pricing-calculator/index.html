<body class="theme-equipment simple-calculator-page"><header class="simple-header"><a href="../#calculators">All calculators</a></header><main class="simple-main"><h1>AI Automation Agency Pricing Calculator</h1><section class="section" id="calculator"><div class="calculator-grid"><form class="calculator-card" id="calcForm"><div class="field"><label for="setupHours">Setup/build hours</label><input id="setupHours" type="number" min="0" step="0.1" value="18"></div><div class="field"><label for="hourlyValue">Your hourly value</label><input id="hourlyValue" type="number" min="0" step="0.01" value="75"></div><div class="field"><label for="setupMargin">Setup profit margin %</label><input id="setupMargin" type="number" min="0" step="1" value="40"></div><div class="field"><label for="monthlyClients">Active retainer clients</label><input id="monthlyClients" type="number" min="0" step="1" value="6"></div><div class="field"><label for="retainer">Monthly retainer per client</label><input id="retainer" type="number" min="0" step="0.01" value="400"></div><div class="field"><label for="supportHours">Support hours per client/month</label><input id="supportHours" type="number" min="0" step="0.1" value="2"></div><div class="field"><label for="software">Software/tools per month</label><input id="software" type="number" min="0" step="0.01" value="250"></div><div class="field"><label for="apiCosts">API/usage costs per month</label><input id="apiCosts" type="number" min="0" step="0.01" value="100"></div><div class="field"><label for="outreach">Outreach/ads/tools per month</label><input id="outreach" type="number" min="0" step="0.01" value="300"></div><div class="field"><label for="other">Other overhead per month</label><input id="other" type="number" min="0" step="0.01" value="100"></div></form><aside class="results-card"><div id="results"></div></aside></div></section>
</main><footer class="simple-footer"><a href="../#calculators">All calculators</a></footer><script>(function(){const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});const number=new Intl.NumberFormat('en-US',{maximumFractionDigits:1});const form=document.getElementById('calcForm');const results=document.getElementById('results');const rows=[['setupCost','Setup labor cost','money'],['suggestedSetup','Suggested setup price','money',true],['mrr','Monthly retainer revenue','money'],['supportCost','Monthly support-time cost','money'],['monthlyExpenses','Monthly expenses','money'],['monthlyProfit','Estimated monthly profit','money'],['profitPerClient','Monthly profit per client','money'],['breakEvenClients','Break-even retainer clients','number']];results.innerHTML=rows.map(([id,label,type,featured])=>`<div class="result-row${featured?' featured':''}"><span>${label}</span><strong data-result="${id}" data-type="${type}">0</strong></div>`).join('');function v(id){const n=parseFloat(document.getElementById(id).value);return Number.isFinite(n)&&n>0?n:0}function f(value,type){return !Number.isFinite(value)?'N/A':type==='money'?money.format(value):number.format(value)}function calc(){const setupHours=v('setupHours'),hourlyValue=v('hourlyValue'),setupMargin=v('setupMargin'),monthlyClients=v('monthlyClients'),retainer=v('retainer'),supportHours=v('supportHours'),software=v('software'),apiCosts=v('apiCosts'),outreach=v('outreach'),other=v('other');const setupCost=setupHours*hourlyValue;const suggestedSetup=setupMargin<100?setupCost/(1-setupMargin/100):NaN;const mrr=monthlyClients*retainer;const supportCost=monthlyClients*supportHours*hourlyValue;const monthlyExpenses=supportCost+software+apiCosts+outreach+other;const monthlyProfit=mrr-monthlyExpenses;const profitPerClient=monthlyClients>0?monthlyProfit/monthlyClients:0;const contribution=retainer-supportHours*hourlyValue;const breakEvenClients=contribution>0?Math.ceil((software+apiCosts+outreach+other)/contribution):NaN;const data={setupCost,suggestedSetup,mrr,supportCost,monthlyExpenses,monthlyProfit,profitPerClient,breakEvenClients};Object.entries(data).forEach(([id,value])=>{const node=results.querySelector(`[data-result="${id}"]`);if(node)node.textContent=f(value,node.dataset.type);});}form.addEventListener('input',calc);calc();})();</script>
